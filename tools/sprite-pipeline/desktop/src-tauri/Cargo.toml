[package]
name = "state-of-war"
version = "0.1.0"
description = "State of War desktop app"
authors = ["HostKurd"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# small, fast release build
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
