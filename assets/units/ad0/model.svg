      <circle cx="3.333" cy="9.5" r="0.8" class="disc" data-z="2.3" fill="#1b2026" data-sx="fs"/>
      <circle cx="10" cy="9.5" r="2" class="disc" data-z="2.3" fill="#56616c" data-sx="fs"/>
      <circle cx="10" cy="9.5" r="0.8" class="disc" data-z="2.3" fill="#1b2026" data-sx="fs"/>
