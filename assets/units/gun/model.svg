<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="192" height="192" data-kind="sm-model">
  <title>Kestrel gunship</title>
  <g data-rot="a" data-lift="46+sin(t*cfg.bobSpeed+id)*cfg.bob">
    <g class="shadow" data-shadow="flat" data-off="0;0" data-z="46" fill="rgba(0,0,0,0.26)">
      <rect x="-17" y="-1.5" width="13" height="3"/>
      <rect x="-19" y="-5" width="3" height="10"/>
      <rect x="-4" y="-12" width="6" height="24"/>
      <ellipse cx="1" cy="0" rx="10.5" ry="5.5"/>
    </g>
    <circle cx="0" cy="0" r="15" class="shadow" data-shadow="flat" data-off="0;0" data-z="46" fill="rgba(0,0,0,0.08)"/>
    <g class="solid" data-z="-4;-3" fill="#1c2127">
      <rect x="-6" y="-6.5" width="14" height="1.3"/>
      <rect x="-6" y="5.2" width="14" height="1.3"/>
    </g>
    <g class="solid" data-z="0;4" fill="#1d5c9c" data-fill="tc.d">
      <rect x="-17" y="-1.5" width="13" height="3"/>
      <rect x="-19" y="-5" width="3" height="10"/>
      <rect x="-4" y="-12" width="6" height="24"/>
      <ellipse cx="1" cy="0" rx="10.5" ry="5.5"/>
    </g>
    <g class="solid" data-z="1;2" fill="#1c2127">
      <rect x="-3" y="-13.5" width="7" height="3"/>
      <rect x="-3" y="10.5" width="7" height="3"/>
    </g>
    <ellipse cx="1" cy="0" rx="10.5" ry="5.5" data-z="6" fill="#42a5ff" data-fill="tc.c" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
    <ellipse cx="6" cy="0" rx="4" ry="3.4" data-z="6" fill="#12202c"/>
    <ellipse cx="7" cy="-1" rx="1.8" ry="1.2" data-z="6" fill="rgba(170,220,255,.45)"/>
    <rect x="-6" y="-1" width="5" height="2" data-z="6" fill="#b5dcff" data-fill="tc.l"/>
    <rect x="10" y="-1" width="6" height="2" data-z="6" fill="#1c2127"/>
    <rect x="-17" y="-1.5" width="12" height="3" data-z="6" fill="#1d5c9c" data-fill="tc.d"/>
    <g transform="translate(-18 0)" data-rot="t*cfg.tailRotorSpeed">
      <line x1="-4" y1="0" x2="4" y2="0" data-z="7" fill="none" stroke="rgba(20,24,28,.7)" stroke-width="1.2"/>
    </g>
    <circle cx="18" cy="0" class="glow" r="9" data-z="5" data-glow="W" opacity="1" fill="#fff0b4" data-if="flash&gt;0"/>
    <g data-rot="t*cfg.rotorSpeed">
      <circle cx="0" cy="0" r="16" data-z="10" fill="rgba(220,230,240,.13)"/>
      <path d="M-16 0L16 0M0 -16L0 16" data-z="10" fill="none" stroke="rgba(20,24,28,.65)" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="2" data-z="10" fill="#1c2127"/>
    </g>
  </g>
</svg>
