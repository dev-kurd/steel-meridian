    </g>
    <circle cx="0" cy="0" r="1" transform="translate(11.8 -18.88)" data-z="2" fill="rgba(255,70,60," data-fill="'rgba(255,70,60,'+(sin(t*5+id)&gt;0?1:.3)+')'" data-scale="sin(t*5+id)&gt;0?2.2:1.4"/>
    <circle cx="11.8" cy="-18.88" class="glow" r="5" data-z="2" data-glow="R" opacity="0.6" fill="#ff6450" data-if="sin(t*5+id)&gt;0"/>
    <circle cx="0" cy="0" r="1" transform="translate(11.8 18.88)" data-z="2" fill="rgba(90,255,140," data-fill="'rgba(90,255,140,'+(sin(t*5+id)&lt;=0?1:.3)+')'" data-scale="sin(t*5+id)&lt;=0?2.2:1.4"/>
    <circle cx="11.8" cy="18.88" class="glow" r="5" data-z="2" data-glow="W" opacity="0.6" fill="#fff0b4" data-if="sin(t*5+id)&lt;=0"/>
    <circle cx="-12.98" cy="0" class="glow" r="5.5" data-z="10" data-glow="O" opacity="0.9" fill="#ffaa3c" data-if="sin(t*6+id)&gt;.2"/>
    <circle cx="20.06" cy="-18.88" class="glow" r="9" data-z="-1" data-glow="W" opacity="1" fill="#fff0b4" data-if="flash&gt;0"/>
    <circle cx="20.06" cy="18.88" class="glow" r="9" data-z="-1" data-glow="W" opacity="1" fill="#fff0b4" data-if="flash&gt;0"/>
