      <path d="M0 0L3.54 0M0 0L-1.77 3.066M0 0L-1.77 -3.066" data-z="1.4" fill="none" stroke="rgba(210,225,240,.8)" stroke-width="1.1"/>
    </g>
    <g transform="translate(-1.18 18.88)" data-rot="t*-cfg.rotorSpeed-a">
      <circle cx="0" cy="0" r="3.658" data-z="1.4" fill="rgba(8,12,16,.9)"/>
