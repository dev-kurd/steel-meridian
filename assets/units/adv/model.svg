    <ellipse cx="10.03" cy="0" rx="7.08" ry="5.074" data-z="7" fill="#12202c"/>
    <ellipse cx="11.446" cy="-1.534" rx="3.068" ry="1.888" data-z="7" fill="rgba(170,220,255,.5)"/>
    <g transform="translate(-8.26 0)">
