    <g class="shadow" data-shadow="flat" data-off="0;0" data-z="alt" fill="rgba(0,0,0,0.24)">
      <rect x="-14.16" y="-23.01" width="25.96" height="8.26" rx="3.54"/>
      <rect x="-14.16" y="14.75" width="25.96" height="8.26" rx="3.54"/>
    </g>
    <circle cx="-1.18" cy="-18.88" class="glow" r="6" data-r="(moving?10.5:8)+rnd()*2.5" data-z="-6" data-glow="W" opacity="0.8" fill="#fff0b4"/>
    <circle cx="-1.18" cy="18.88" class="glow" r="6" data-r="(moving?10.5:8)+rnd()*2.5" data-z="-6" data-glow="W" opacity="0.8" fill="#fff0b4"/>
    <circle cx="-20.06" cy="-5.9" class="glow" r="7" data-r="7+rnd()*5" data-z="1" data-glow="O" opacity="0.9" fill="#ffaa3c" data-if="moving"/>
    <circle cx="-20.06" cy="5.9" class="glow" r="7" data-r="7+rnd()*5" data-z="1" data-glow="O" opacity="0.9" fill="#ffaa3c" data-if="moving"/>
    <circle cx="0" cy="0" class="glow" r="13" data-r="13+sin(t*3)*2" data-z="-14" data-glow="W" opacity="0.3" fill="#fff0b4" data-if="docked"/>
    <g data-rot="t*(busy?cfg.ringSpeedBusy:cfg.ringSpeed)-a">
      <circle cx="0" cy="0" r="1" data-z="-7" fill="none" stroke="rgba(90,170,255,.95)" data-stroke="busy&amp;&amp;cap?'rgba(90,170,255,.95)':busy?'rgba(200,140,255,.95)':site?'rgba(255,207,90,.95)':team?'rgba(255,170,140,.65)':'rgba(140,210,255,.65)'" stroke-dasharray="5 4" data-lw="busy?2.2:1.6" data-scale="(11+sin(t*5)*(busy?2.6:.8))*1.18"/>
      <circle cx="0" cy="0" r="1" data-z="-7" fill="none" stroke="rgba(90,170,255,.95)" data-stroke="busy&amp;&amp;cap?'rgba(90,170,255,.95)':busy?'rgba(200,140,255,.95)':site?'rgba(255,207,90,.95)':team?'rgba(255,170,140,.65)':'rgba(140,210,255,.65)'" stroke-dasharray="5 4" data-lw="2.2" data-scale="(11+sin(t*5)*(busy?2.6:.8))*1.18*.55" opacity="0.5" data-if="busy"/>
    </g>
    <g class="solid" data-z="-3;0" fill="#1c2127">
