    <polygon points="14.16,-9.44 -7.67,-18.29 -16.52,-7.67 -16.52,7.67 -7.67,18.29 14.16,9.44" data-z="3" fill="#42a5ff" data-fill="tc.c" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
    <rect x="-15.93" y="-1.652" width="9.44" height="3.304" data-z="3" fill="#ffcf5a"/>
    <rect x="-5.9" y="-14.16" width="1.77" height="28.32" data-z="3" fill="rgba(0,0,0,.3)"/>
    <rect x="-10.62" y="-12.39" width="2.36" height="24.78" data-z="3" fill="#b5dcff" data-fill="tc.l" data-alpha=".5+.5*sin(t*4+id)"/>
